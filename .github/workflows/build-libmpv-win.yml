name: build-libmpv-windows

# 构建 mpv-dev-x86_64 包（libmpv-2.dll + libmpv.dll.a + 头文件，依赖全部
# 静态链接进 DLL）。构建流程与 shinchiro/mpv-winbuild-cmake 的
# .github/workflows/mpv_clang.yml 保持一致（x86_64 分支），仅保留以下差异：
#   1. 只构建 x86_64 基线架构（任何 64 位 CPU 可运行，面向大众分发最稳；
#      如需 v3 微架构：configure 加 -DGCC_ARCH=x86-64-v3、BIT 改成
#      x86_64_v3、目录/缓存键/artifact 名同步改名），只上传 mpv-dev 包
#   2. mpv 源码指向本仓库（含杜比视界补丁），而不是上游 mpv-player/mpv
#   3. libplacebo 锁定 v7.351.0（本补丁树验证过的版本）
#   4. 从零构建时先 ninja llvm / llvm-clang 再 ninja mpv：包配方用的
#      x86_64-w64-mingw32-gcc 是包装脚本，背后调用 clang_root/bin/clang，
#      而它与 llvm 无依赖边、并行调度时包 configure 会先于 LLVM 就绪
#      （libiconv configure 退出码 77 即此症状）。上游不需要这两步是因为
#      其 clang_root 缓存由 llvm_clang.yml workflow 预热，从不真正从零构建
#   5. libplacebo v7.351.0 的 utils_gen.py 与镜像里的 Python 3.14 不兼容
#      （ElementTree.__init__ 新增类型校验），构建前打一行补丁，等价于
#      上游修复 haasn/libplacebo@12509c0f1e（该修复不在任何 v7.351.x 里）
#   6. 还原 Vulkan 静态 loader（ci/winbuild-overrides/vulkan-restore-
#      static-loader.patch，revert 上游 5f773c9"vulkan: disable static
#      loader"，该提交 2026-08-04 起把 loader 改回动态）。动态方案下
#      libmpv-2.dll 硬依赖 vulkan-1.dll，无 Vulkan 驱动的 Windows 机器
#      （System32 无 vulkan-1.dll）LoadLibrary 直接失败、播放器不可用；
#      静态 loader 让 libmpv 自包含。同时清掉缓存里动态时期安装的
#      libvulkan.dll.a / vulkan-1.dll（MinGW 链接器 dll.a 优先于 .a，
#      残留会让补丁静默失效）
# 与上游相同的要点（之前失败的主因是对应项不一致）：
#   - 容器用上游预构建镜像 ghcr.io/shinchiro/archlinux:latest，依赖版本与
#     上游每日构建完全一致，不再手动 pacman 安装（Arch 滚动更新会引入漂移）
#   - 不加 -DGCC_ARCH，编译目标为基线 x86-64（与上游 64bit 包一致）
#   - -DENABLE_CCACHE=ON -DCLANG_PACKAGES_LTO=ON（上游默认配置）
#   - 缓存布局：clang_root（LLVM+rustup）/ src_packages（源码克隆）/
#     build_x86_64（工具链与构建树），构建结束后 rm -rf build/mpv* 与
#     cargo-clean，mpv 每次运行都按当前提交全量重建
# 需要强制重建工具链时，把 CACHE_VER 改成新字符串作废全部缓存。

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CACHE_VER: v2

permissions:
  contents: read

jobs:
  build_mpv:
    name: Building mpv-dev x86_64
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    env:
      BIT: x86_64
    steps:
      # 对应上游 mpv_clang.yml 的 "Init variable"（x86_64 分支）
      - name: Init variable
        run: echo "arch=x86_64" >> $GITHUB_ENV

      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory $PWD

      - name: Checkout mpv (this repo)
        uses: actions/checkout@v4

      - name: Checkout mpv-winbuild-cmake
        uses: actions/checkout@v4
        with:
          repository: shinchiro/mpv-winbuild-cmake
          ref: master
          path: mpv-winbuild-cmake

      - name: Loading clang sysroot cache
        uses: actions/cache/restore@v4
        with:
          path: clang_root
          key: ${{ env.CACHE_VER }}-clang_root-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VER }}-clang_root

      - name: Loading repository cache
        uses: actions/cache/restore@v4
        with:
          path: src_packages
          key: ${{ env.CACHE_VER }}-repository-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VER }}-repository

      - name: Loading x86_64 toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: build_x86_64
          key: ${{ env.CACHE_VER }}-clang-x86_64_toolchain-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VER }}-clang-x86_64_toolchain

      - name: Point mpv package source to this repo
        run: |
          # 让 mpv 包从本仓库克隆（而不是上游 mpv-player/mpv）；
          # 本地路径克隆不支持 --filter=tree:0，删除该克隆参数
          sed -i "s|GIT_REPOSITORY https://github.com/mpv-player/mpv.git|GIT_REPOSITORY ${GITHUB_WORKSPACE}|" \
            mpv-winbuild-cmake/packages/mpv.cmake
          sed -i '/GIT_CLONE_FLAGS/d' mpv-winbuild-cmake/packages/mpv.cmake
          # libplacebo 锁定到 v7.351.0（本补丁树验证过的版本），避免其 master 未来
          # 大版本变动导致与 mpv 0.41 的 API 不兼容
          sed -i 's|GIT_REPOSITORY https://github.com/haasn/libplacebo.git|GIT_REPOSITORY https://github.com/haasn/libplacebo.git\n    GIT_TAG v7.351.0|' \
            mpv-winbuild-cmake/packages/libplacebo.cmake
          grep -n "GIT_REPOSITORY\|GIT_CLONE_FLAGS\|GIT_TAG" mpv-winbuild-cmake/packages/mpv.cmake mpv-winbuild-cmake/packages/libplacebo.cmake || true
          # subrandr 是唯一的 Rust 包，CLANG_PACKAGES_LTO 下以
          # linker-plugin-lto + embed-bitcode 输出 LLVM bitcode，其版本跟随
          # rustup nightly（当前 LLVM 23.1.0），而工具链 lld 固定 release/22.x，
          # 主版本不一致时链接 libmpv-2.dll 报 "ld.lld: error: Not an int
          # attribute"。删掉 LTO 注入让它输出原生对象（字幕渲染器性能损失可
          # 忽略），从此免疫 nightly 与工具链的 LLVM 版本漂移
          sed -i '/cargo_lto_rustflags/d' mpv-winbuild-cmake/packages/subrandr.cmake
          if grep -q 'cargo_lto_rustflags' mpv-winbuild-cmake/packages/subrandr.cmake; then
            echo 'subrandr LTO 补丁未生效，上游配方可能已改动' >&2
            exit 1
          fi
          # mpv 的远端是本地路径（本仓库的 checkout），force-update 里硬编码的
          # git fetch --filter=tree:0 对本地远端不可靠；删除旧克隆，让 download
          # 步骤按本次触发的提交重新克隆（mpv 体积小，代价可忽略）
          rm -rf src_packages/mpv
          # 还原 Vulkan 静态 loader（见文件头注释第 6 点）。打完必须 grep 校验，
          # 上游再改 packages/vulkan.cmake 时在这里立刻失败，避免静默产出
          # 依赖系统 vulkan-1.dll 的 libmpv
          git -C mpv-winbuild-cmake am --3way ci/winbuild-overrides/vulkan-restore-static-loader.patch
          grep -q 'BUILD_STATIC_LOADER=ON' mpv-winbuild-cmake/packages/vulkan.cmake || {
            echo 'vulkan static-loader patch failed to apply' >&2
            exit 1
          }
          # 清理动态链接时期（上游 5f773c9 之后）留在缓存里的 vulkan 产物：
          # libvulkan.dll.a 会让 -lvulkan 静默选回动态导入库；vulkan-prefix/
          # src_packages/vulkan 删掉以强制 vulkan 包按静态配方重装
          rm -rf src_packages/vulkan build_$BIT/vulkan-prefix
          rm -fv build_$BIT/$BIT-w64-mingw32/lib/libvulkan.dll.a \
                  build_$BIT/$BIT-w64-mingw32/bin/vulkan-1.dll

      # 命令行与上游 mpv_clang.yml 完全一致，仅 -S 指向子目录 checkout
      - name: Configuring CMake & Downloading source
        run: |
          cmake -DTARGET_ARCH=${{ env.arch }}-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang \
            -DCMAKE_INSTALL_PREFIX=$PWD/clang_root \
            -DMINGW_INSTALL_PREFIX=$PWD/build_$BIT/$BIT-w64-mingw32 \
            -DSINGLE_SOURCE_LOCATION=$PWD/src_packages \
            -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup \
            -DENABLE_CCACHE=ON -DCLANG_PACKAGES_LTO=ON \
            -G Ninja --fresh -B build_$BIT -S $PWD/mpv-winbuild-cmake
          ninja -C build_$BIT download || true

      - name: Building mpv
        run: |
          ninja -C build_$BIT update
          # libplacebo v7.351.0 的 utils_gen.py 把 ElementTree 对象当 Element 传，
          # 镜像滚动到 Python 3.14 后新增的类型校验直接 TypeError（见文件头注释
          # 第 5 点）。必须放在 update 之后：force-update 的 git reset --hard 会
          # 还原源码树；install 后的 postremovebuild 也会还原，每次运行重打是幂等的
          sed -i 's|VkXML(ET.parse(xmlfile))|VkXML(ET.parse(xmlfile).getroot())|' \
            src_packages/libplacebo/src/vulkan/utils_gen.py
          grep -n 'registry = VkXML' src_packages/libplacebo/src/vulkan/utils_gen.py
          # 从零自举必须先建 LLVM 本体再建其余工具链（见文件头注释第 4 点）；
          # 缓存命中时 stamps 已在 build 树里，这两条是秒级 no-op
          ninja -C build_$BIT llvm
          ninja -C build_$BIT llvm-clang
          ninja -C build_$BIT mpv

      - name: Packaging mpv-dev
        run: |
          ninja -C build_$BIT mpv-packaging
          mkdir -p release_$BIT
          # 只取 mpv-dev 包（含 libmpv-2.dll / libmpv.dll.a / include/），
          # 播放器与 debug 包留在构建树里随清理步骤丢弃
          mv build_$BIT/mpv-dev-*.7z release_$BIT/
          # 兜底收集：静态 loader 生效后产物不应再出现 vulkan-1.dll；万一
          # 补丁失效漂移回动态链接，也把 vulkan-1.dll 带出（存在才收），
          # 供应用侧随 libmpv-2.dll 一起分发
          find build_$BIT -name 'vulkan-1.dll' -exec cp {} release_$BIT/ \; 2>/dev/null || true
          ls -lh release_$BIT/

      - name: Dump failed package logs
        if: failure()
        run: |
          # 包配方的 LOG_CONFIGURE/LOG_BUILD=1 会把真实报错吞进 stamp 日志文件，
          # Actions 日志只能看到退出码；失败时把各阶段日志末尾打出来，避免盲排
          find build_$BIT \( -path '*-stamp/*-configure-*.log' \
                           -o -path '*-stamp/*-build-*.log' \
                           -o -path '*-stamp/*-install-*.log' \
                           -o -path '*-stamp/*-download-*.log' \
                           -o -path '*-stamp/*-update-*.log' \) 2>/dev/null \
            | while read -r f; do
                echo "===== $f ====="
                tail -c 20000 "$f"
                echo
              done

      - name: Uploading mpv-dev package
        uses: actions/upload-artifact@v4
        with:
          name: mpv-dev-x86_64
          path: release_x86_64/
          if-no-files-found: error

      # 以下清理与缓存保存流程和上游 mpv_clang.yml 一致：mpv 的源码克隆之外
      # 一切构建产物（stamps、包目录）都删掉，mpv 下次运行强制全量重建
      - name: Cleaning build directory
        if: always()
        run: rm -rf build_$BIT/mpv*

      - name: Cleaning rust toolchain directory
        if: always()
        run: ninja -C build_$BIT cargo-clean || true

      - name: Saving clang sysroot cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: clang_root
          key: ${{ env.CACHE_VER }}-clang_root-${{ github.run_id }}

      - name: Saving repository cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src_packages
          key: ${{ env.CACHE_VER }}-repository-${{ github.run_id }}

      - name: Saving x86_64 toolchain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build_x86_64
          key: ${{ env.CACHE_VER }}-clang-x86_64_toolchain-${{ github.run_id }}
