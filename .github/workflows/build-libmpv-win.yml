name: build-libmpv-windows

# 构建 Windows 单文件静态 mpv-2.dll（含 gpu-next render backend，支持杜比视界）。
# 交叉编译体系使用 shinchiro/mpv-winbuild-cmake（Arch 容器 + clang/LLVM 交叉工具链），
# mpv 源码指向本仓库（含杜比视界补丁），产物为静态链接的独立 DLL。
#
# 缓存策略（复刻 Richasy/mpv 自托管 runner 的持久状态，用 actions/cache 实现，
# 与上游 shinchiro mpv_clang.yml 每日构建同构）：
#   clang_root   - LLVM 交叉工具链 + rustup（从零构建 1h+，命中缓存则完全跳过）
#   build64      - 构建树（ExternalProject stamps + mingw 安装前缀；LLVM 的
#                  构建树在 install 后被配方里的 cleanup() 删除，不会撑爆缓存）
#   src_packages - 源码包缓存（media.xiph.org 等小镜像偶发 TLS 抖动，
#                  如 2026-08 的 opus-dnn，缓存后只需成功下载一次）
# 首次运行缓存全空，等价于旧的从零构建；之后 LLVM/工具链/依赖全部增量。
# 需要强制重建工具链时，把 CACHE_VER 改成新字符串作废全部缓存。

on:
  workflow_dispatch:

env:
  CACHE_VER: v1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          echo -e "[multilib]\nInclude = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git ninja cmake meson clang lld libc++ \
            unzip ragel yasm nasm gperf rst2pdf lib32-gcc-libs lib32-glib2 \
            python-cairo curl wget mimalloc ccache python-pip 7zip shaderc
          python -m pip install --break-system-packages roman
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout mpv (this repo)
        uses: actions/checkout@v4

      - name: Checkout mpv-winbuild-cmake
        uses: actions/checkout@v4
        with:
          repository: shinchiro/mpv-winbuild-cmake
          path: mpv-winbuild-cmake

      # 缓存必须在 configure 之前恢复：stamps 在 build64 里，命中后
      # ninja llvm/llvm-clang 直接跳过；src_packages 让下载步骤只补缺失的包
      - name: Restore clang_root cache
        uses: actions/cache/restore@v4
        with:
          path: clang_root
          key: ${{ env.CACHE_VER }}-clang_root-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VER }}-clang_root-

      - name: Restore build tree cache
        uses: actions/cache/restore@v4
        with:
          path: build64
          key: ${{ env.CACHE_VER }}-build64-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VER }}-build64-

      - name: Restore source packages cache
        uses: actions/cache/restore@v4
        with:
          path: src_packages
          key: ${{ env.CACHE_VER }}-src_packages-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_VER }}-src_packages-

      - name: Point mpv package source to this repo
        run: |
          # 让 mpv 包从本仓库克隆（而不是上游 mpv-player/mpv）；
          # 本地路径克隆不支持 --filter=tree:0，删除该克隆参数
          sed -i "s|GIT_REPOSITORY https://github.com/mpv-player/mpv.git|GIT_REPOSITORY ${GITHUB_WORKSPACE}|" \
            mpv-winbuild-cmake/packages/mpv.cmake
          sed -i '/GIT_CLONE_FLAGS/d' mpv-winbuild-cmake/packages/mpv.cmake
          # libplacebo 锁定到 v7.351.0（本补丁树验证过的版本），避免其 master 未来
          # 大版本变动导致与 mpv 0.41 的 API 不兼容
          sed -i 's|GIT_REPOSITORY https://github.com/haasn/libplacebo.git|GIT_REPOSITORY https://github.com/haasn/libplacebo.git\n    GIT_TAG v7.351.0|' \
            mpv-winbuild-cmake/packages/libplacebo.cmake
          grep -n "GIT_REPOSITORY\|GIT_CLONE\|GIT_TAG" mpv-winbuild-cmake/packages/mpv.cmake mpv-winbuild-cmake/packages/libplacebo.cmake || true

          # 参考 Richasy/mpv ci/build-libmpv.sh：命中缓存的构建树里 mpv 的
          # download stamp 还在，ExternalProject 会跳过克隆、拿旧源码构建；
          # 每次运行前删掉 mpv 的源码与 stamp，强制重新克隆本仓库当前提交。
          # （libplacebo 已用 GIT_TAG 锁死，靠 update 步骤前进，无需清除）
          rm -rf src_packages/mpv \
                 build64/packages/mpv-prefix \
                 build64/mpv-dev-*

      - name: Configure
        run: |
          # CMAKE_INSTALL_PREFIX/RUSTUP_LOCATION 指到 clang_root，让 LLVM 工具链
          # 和 rustup 落进可缓存目录（与上游 mpv_clang.yml 布局一致）
          cmake -Wno-dev --fresh \
            -DTARGET_ARCH=x86_64-w64-mingw32 \
            -DCOMPILER_TOOLCHAIN=clang \
            -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/clang_root \
            -DMINGW_INSTALL_PREFIX=${GITHUB_WORKSPACE}/build64/x86_64-w64-mingw32 \
            -DSINGLE_SOURCE_LOCATION=${GITHUB_WORKSPACE}/src_packages \
            -DRUSTUP_LOCATION=${GITHUB_WORKSPACE}/clang_root/install_rustup \
            -DENABLE_CCACHE=OFF \
            -G Ninja -S mpv-winbuild-cmake -B build64

      - name: Download package sources
        run: |
          # CMake file(DOWNLOAD) 没有重试机制，小镜像（media.xiph.org 等）偶发
          # TLS 抖动一次就失败；已下载的包有 stamp 会跳过，整轮重试只补漏。
          # 缺失的包此处不阻断，留到构建对应目标时再试，失败日志里有详情
          ok=0
          for i in 1 2 3; do
            if ninja -C build64 download; then ok=1; break; fi
            echo "download round $i failed, retrying in 15s"; sleep 15
          done
          [ "$ok" = 1 ] || echo "::warning::部分源码包下载未完成，将在构建阶段重试"

      - name: Build LLVM/MinGW toolchain
        run: |
          # 必须先构建 LLVM 本体（ninja llvm）装出 clang_root/bin/clang：
          # mingw-w64-crt 的 x86_64-w64-mingw32-gcc 是 llvm-wrapper 生成的
          # 包装脚本，内部调用 ${CMAKE_INSTALL_PREFIX}/bin/clang；而 ep 依赖
          # 顺序里 crt 在 llvm 之前，伞目标 llvm-clang 假定 clang 已存在。
          # 缓存命中时 stamps 已在 build64，下面两条都是秒级 no-op
          ninja -C build64 llvm
          ninja -C build64 llvm-clang

      - name: Ensure rustup (rav1e 等 Rust 依赖需要)
        # 不再 rustup-fullclean：rustup 装在 clang_root 里随缓存复用，
        # fullclean 会每轮删掉缓存重新下载
        run: ninja -C build64 rustup || true

      - name: Build mpv
        run: |
          # update：让缓存里跟踪上游 master 的包（ffmpeg 等）前进到最新
          ninja -C build64 update || true
          ninja -C build64 mpv

      - name: Dump failed package logs
        if: failure()
        run: |
          # 包配方的 LOG_CONFIGURE/LOG_BUILD=1 会把真实报错吞进 stamp 日志文件，
          # Actions 日志只能看到退出码；失败时把 download/update/configure/
          # build/install 日志末尾打出来，避免再次盲排（2026-08 opus-dnn 下载
          # 失败时就因缺 download 日志多排了一轮）
          find build64 \( -path '*-stamp/*-configure-*.log' \
                       -o -path '*-stamp/*-build-*.log' \
                       -o -path '*-stamp/*-install-*.log' \
                       -o -path '*-stamp/*-download-*.log' \
                       -o -path '*-stamp/*-update-*.log' \) 2>/dev/null \
            | while read -r f; do
                echo "===== $f ====="
                tail -c 20000 "$f"
                echo
              done

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp build64/mpv-dev-*/libmpv-2.dll dist/libmpv-2.dll
          # 上游 2026-08 起 vulkan loader 改为动态链接（KhronosGroup/Vulkan-Loader#1538），
          # libmpv-2.dll 运行时依赖 vulkan-1.dll，一并收集（存在才收）
          find build64 -name 'vulkan-1.dll' -not -path '*/dist/*' -exec cp {} dist/ \; 2>/dev/null || true
          ls -lh dist/

      - name: Upload libmpv-2.dll
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-2.dll-windows-x86_64
          path: dist/
          if-no-files-found: error

      # 即使构建失败也保存缓存：比如 LLVM 建了一小时后在 mpv 阶段挂掉，
      # 工具链缓存照样落盘，下一轮直接从 mpv 阶段继续
      - name: Save clang_root cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: clang_root
          key: ${{ env.CACHE_VER }}-clang_root-${{ github.run_id }}

      - name: Save build tree cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build64
          key: ${{ env.CACHE_VER }}-build64-${{ github.run_id }}

      - name: Save source packages cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src_packages
          key: ${{ env.CACHE_VER }}-src_packages-${{ github.run_id }}
