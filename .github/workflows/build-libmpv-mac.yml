name: build-libmpv-macos

# 构建 macOS 自包含静态 libmpv.2.dylib（universal：arm64 + x86_64）。
# 与 Windows 版 libmpv-2.dll 对应：所有第三方依赖（ffmpeg/libass/libplacebo/
# libbluray/libdvdnav 等）从源码静态链入，产物仅依赖系统库，可直接拷贝进
# 应用目录使用，无需用户安装任何东西。含本仓库特性：在线播放 ISO 光盘
# 镜像、gpu-next render backend（杜比视界）。
# 依赖版本与构建逻辑见 ci/build-libmpv-macos.sh。
#
# ⚠️ 工具链锁定：必须用 Xcode 15.x（macOS 14 SDK）构建。Xcode 16+/SDK 15+
# 会给 Swift 层引入 /usr/lib/swift/libswiftFoundation.dylib 硬依赖，该库
# macOS 15 起才随系统提供，产物将无法在 macOS 14 及以下加载（115-Desktop
# 在 macOS 14.5 用户上播放器不可用的根因）。macos-15 镜像已不带 Xcode 15.x
# （2026-08 实测仅 16.0–16.4/26.x），故跑在 macos-14 上（Xcode 15 世代），
# 下方仍有自动选择 Xcode 15.x 的一步；脚本内置同款 SDK 守卫双保险。
# 注意：macos-14 镜像 2026-11-02 停用，届时需要迁移（自托管 runner、
# CI 内下载 Xcode 15.4、或放弃 macOS<15 支持），见 runner-images 弃用公告。
# 构建产物声明支持 macOS 11.0+；构建即运行在 macOS 14 上，冒烟测试直接
# 覆盖线上 macOS 14.5 用户场景。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      # ci/build-libmpv-macos.sh 默认 WORK=<仓库根>/build-macos-static
      ARTIFACT: build-macos-static/dist/libmpv.2.dylib
    steps:
      - name: Install build tools
        run: brew install meson ninja pkg-config nasm

      - name: Checkout mpv (this repo)
        uses: actions/checkout@v4

      - name: Select Xcode 15.x toolchain (macOS 14 SDK)
        run: |
          echo "runner 上可用的 Xcode："
          best=""; best_ver=""
          for app in /Applications/Xcode*.app; do
            ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                  "$app/Contents/Info.plist" 2>/dev/null || echo 0)
            echo "  $app → $ver"
            if [[ ${ver%%.*} == 15 ]]; then
              if [[ -z $best_ver ]] || \
                 [[ $(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1) == "$ver" ]]; then
                best=$app; best_ver=$ver
              fi
            fi
          done
          if [[ -z $best ]]; then
            echo "::error::runner 未安装 Xcode 15.x（需 macOS 14 SDK 以支持 macOS<15）。请参考上方列表调整本步骤或更换 runner 镜像。"
            exit 1
          fi
          echo "选用 $best (version $best_ver)"
          echo "DEVELOPER_DIR=$best" >> "$GITHUB_ENV"

      - name: Build universal libmpv.2.dylib
        run: ./ci/build-libmpv-macos.sh universal

      - name: Smoke test (dlopen + create/initialize)
        run: |
          # 静态断言：禁止非弱链接的 libswiftFoundation（macOS 15+ 才有）
          if otool -L "$ARTIFACT" | grep 'libswiftFoundation.dylib' | grep -qv '(weak)'; then
            echo "::error::存在 libswiftFoundation.dylib 硬依赖，产物无法在 macOS 14 加载"; exit 1
          fi
          for a in arm64 x86_64; do
            minos=$(otool -arch "$a" -l "$ARTIFACT" 2>/dev/null \
              | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
            echo "[$a] minos=$minos"
            [[ $minos == 11.0 ]] || { echo "::error::[$a] minos 异常: $minos"; exit 1; }
          done
          cat > /tmp/smoke.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
              void *h = dlopen(argv[1], RTLD_NOW | RTLD_GLOBAL);
              if (!h) { fprintf(stderr, "dlopen: %s\n", dlerror()); return 1; }
              unsigned (*ver)(void) = dlsym(h, "mpv_client_api_version");
              void *(*create)(void) = dlsym(h, "mpv_create");
              int (*init)(void *) = dlsym(h, "mpv_initialize");
              void (*term)(void *) = dlsym(h, "mpv_terminate_destroy");
              if (!ver || !create || !init || !term) return 2;
              printf("client API %x\n", ver());
              void *ctx = create();
              if (!ctx) return 3;
              if (init(ctx) < 0) return 4;
              term(ctx);
              printf("smoke OK\n");
              return 0;
          }
          EOF
          clang /tmp/smoke.c -o /tmp/smoke
          /tmp/smoke "$ARTIFACT"
          # x86_64 切片通过 Rosetta 验证（runner 无 Rosetta 时跳过）
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            clang -arch x86_64 /tmp/smoke.c -o /tmp/smoke-x64
            arch -x86_64 /tmp/smoke-x64 "$ARTIFACT"
          else
            echo "runner 无 Rosetta，跳过 x86_64 冒烟测试"
          fi

      - name: Collect artifact info
        run: |
          ls -lh "$ARTIFACT"
          lipo -info "$ARTIFACT"
          otool -L "$ARTIFACT"

      - name: Upload libmpv.2.dylib
        uses: actions/upload-artifact@v4
        with:
          name: libmpv.2.dylib-macos-universal
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
